# =========================================================
#  Mihomo / Stash / Shadowrocket 通用极简分流模板 (Lite)
#  专为转发面板 / 订阅中心 (如 FLYX、Sub-Store 等) 设计
#  特点：
#    1. 纯粹三大核心策略组【国内】、【国外】、【AI】
#    2. 规则集全部采用 YAML 格式，全平台通用兼容 (Mihomo / Stash / Shadowrocket)
# =========================================================

# --- 基础配置 ---
mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: warning
ipv6: true
unified-delay: true
tcp-concurrent: true

# 面板节点占位符 (转发面板在下发订阅时会自动注入节点列表)
proxies: []

# --- 策略组配置 ---
proxy-groups:
  - name: 国外
    type: select
    icon: https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/Proxy.svg
    proxies:
      - 自动选择
      - DIRECT
    include-all: true
    exclude-type: DIRECT

  - name: 国内
    type: select
    icon: https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/China.svg
    proxies:
      - DIRECT
      - 国外

  - name: AI
    type: select
    icon: https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/OpenAI.svg
    proxies:
      - 国外
      - 自动选择
    include-all: true
    exclude-type: DIRECT

  - name: 自动选择
    type: url-test
    icon: https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/Auto.svg
    url: https://www.apple.com/library/test/success.html
    interval: 300
    tolerance: 50
    lazy: true
    include-all: true
    exclude-type: DIRECT

  - name: 漏网之鱼
    type: select
    icon: https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/Stack.svg
    proxies:
      - 国外
      - 国内

# --- DNS 配置 ---
dns:
  enable: true
  ipv6: true
  use-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-filter:
    - "rule-set:private"
    - "rule-set:geolocation-cn"
    - "+.lan"
    - "+.local"
  default-nameserver:
    - 114.114.114.114
    - 223.5.5.5
  proxy-server-nameserver:
    - 114.114.114.114
    - 223.5.5.5
  nameserver:
    - "https://cloudflare-dns.com/dns-query#国外"
    - "https://dns.google/dns-query#国外"
  nameserver-policy:
    "rule-set:private": system
    "rule-set:cn":
      - 223.5.5.5
      - 119.29.29.29
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29

# --- 规则集 (YAML 格式，全客户端通用) ---
rule-providers:
  private:
    type: http
    behavior: domain
    format: yaml
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.yaml
    path: ./ruleset/private.yaml
  private_ip:
    type: http
    behavior: ipcidr
    format: yaml
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.yaml
    path: ./ruleset/private_ip.yaml
  geolocation-cn:
    type: http
    behavior: domain
    format: yaml
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/geolocation-cn.yaml
    path: ./ruleset/geolocation-cn.yaml
  cn:
    type: http
    behavior: domain
    format: yaml
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.yaml
    path: ./ruleset/cn.yaml
  cn_ip:
    type: http
    behavior: ipcidr
    format: yaml
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.yaml
    path: ./ruleset/cn_ip.yaml
  games_cn:
    type: http
    behavior: domain
    format: yaml
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-games@cn.yaml
    path: ./ruleset/games_cn.yaml
  category-ads:
    type: http
    behavior: domain
    format: yaml
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ads-all.yaml
    path: ./ruleset/category-ads.yaml
  ai:
    type: http
    behavior: domain
    format: yaml
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ai-!cn.yaml
    path: ./ruleset/ai.yaml
  geolocation-!cn:
    type: http
    behavior: domain
    format: yaml
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/geolocation-!cn.yaml
    path: ./ruleset/geolocation-!cn.yaml
  iptv_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/marcuccilli/gary@main/iptv_mihomo_domain.mrs
    path: ./ruleset/iptv_domain.mrs
  iptv_ip:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    url: https://cdn.jsdmirror.com/gh/marcuccilli/gary@main/iptv_mihomo_ipcidr.mrs
    path: ./ruleset/iptv_ip.mrs

# --- 路由分流规则 ---
rules:
  # 规则集与面板下载域名
  - DOMAIN,github.com,国外
  - DOMAIN,raw.githubusercontent.com,国外
  - DOMAIN,cdn.jsdelivr.net,国外
  - DOMAIN,cdn.jsdmirror.com,国外

  # 公共 DNS 真实 IP 直连
  - IP-CIDR,223.5.5.5/32,国内,no-resolve
  - IP-CIDR,223.6.6.6/32,国内,no-resolve
  - IP-CIDR,119.29.29.29/32,国内,no-resolve
  - IP-CIDR,114.114.114.114/32,国内,no-resolve

  # 私有网络直连
  - RULE-SET,private,国内
  - RULE-SET,private_ip,国内,no-resolve

  # 国内服务直连
  - RULE-SET,geolocation-cn,国内
  - RULE-SET,cn,国内
  - RULE-SET,games_cn,国内
  - DOMAIN-SUFFIX,cn,国内

  # 广告拦截
  - RULE-SET,category-ads,REJECT

  # AI 智能服务
  - RULE-SET,ai,AI

  # Gary 源 IPTV 规则分流走代理
  - RULE-SET,iptv_domain,国外
  - RULE-SET,iptv_ip,国外,no-resolve

  # 国外代理流量
  - RULE-SET,geolocation-!cn,国外

  # 兜底分流
  - RULE-SET,cn_ip,国内
  - MATCH,漏网之鱼
