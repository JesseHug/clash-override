# ==================== 路由规则 ====================
rules:
  # 直连 & 私有网络
  - RULE-SET,Private,直连
  - RULE-SET,GamesCN,直连
  - RULE-SET,AppleCN,直连

  # QUIC 拦截：禁用国外 UDP/443，防止视频卡顿
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((OR,((RULE-SET,geolocation-cn),(RULE-SET,cn_additional),(RULE-SET,ChinaIP,no-resolve)))))),REJECT

  - RULE-SET,GoogleFCM,FCM

  # AI
  - RULE-SET,OpenAI,OpenAI
  - RULE-SET,AI,AI
  - RULE-SET,AIIP,AI,no-resolve

  # 流媒体 & 应用
  - RULE-SET,YouTube,YouTube
  - RULE-SET,Google,Google
  - RULE-SET,GoogleIP,Google,no-resolve
  - RULE-SET,Gemini,Google
  - RULE-SET,Spotify,Spotify
  - RULE-SET,Telegram,Telegram
  - RULE-SET,TelegramIP,Telegram,no-resolve
  - RULE-SET,Games,Games
  - RULE-SET,SteamASN,Games,no-resolve
  - RULE-SET,PayPal,PayPal
  - RULE-SET,Twitter,X
  - RULE-SET,TwitterIP,X,no-resolve
  - RULE-SET,Apple,Apple
  - DOMAIN-SUFFIX,nubebelle.com,Emby
  - RULE-SET,Emby,Emby
  - RULE-SET,EmbyIP,Emby

  # 国外网站兜底
  - RULE-SET,geolocation-!cn,Proxies

  # 国内域名
  - RULE-SET,geolocation-cn,直连
  - RULE-SET,cn_additional,直连

  # IP 规则（no-resolve：不主动触发 DNS，仅已知 IP 时匹配）
  - RULE-SET,ChinaIP,直连

  # GeoIP 兜底
  - GEOIP,CN,直连
  - RULE-SET,PrivateIP,直连
  - MATCH,Final
