    filter: '(?i)🇭🇰|香港|(?<![a-z])hk(?![a-z])|hong\s*kong'
  - name: SG
    <<: *BaseSelect
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png
    proxies: [SG-自动选择]
    include-all: true
    filter: '(?i)🇸🇬|新加坡|狮城|(?<![a-z])sg(?![a-z])|singapore'
  - name: TW
