# =========================================================
#  Bettbox / Mihomo 高性能配置
#  仓库：https://github.com/JesseHug/clash-override
#  链接：https://raw.githubusercontent.com/JesseHug/clash-override/master/config.yaml
#  完全对齐 override.js v10.1
# =========================================================

# --- 锚点定义 (通用属性) ---
proxy_providers_common: &proxy_providers_common
  type: http
  interval: 86400
  proxy: DIRECT
  health-check: { enable: true, url: https://g.cn/generate_204, interval: 600, lazy: true }

global_exclude_filter: &global_exclude_filter
  exclude-filter: '(?i)(群|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|电报|频道|无法|说明|提示|访问|支持|教程|关注|更新|作者|加入|超时|收藏|优惠|福利|邀请|好友|失联|选择|剩余|公益|发布|DIZTNA|通路|登录|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|建议|重置|以下|⚠️|@|t\.me\/\+|expire|http|com|traffic)'

BehaviorDN: &BehaviorDN
  type: http
  behavior: domain
  format: mrs
  interval: 86400

BehaviorIP: &BehaviorIP
  type: http
  behavior: ipcidr
  format: mrs
  interval: 86400

BaseUT: &BaseUT
  type: url-test
  url: "https://g.cn/generate_204"
  interval: 300
  tolerance: 50
  lazy: true
  timeout: 3000
  hidden: true
  max-failed-times: 3
  exclude-type: "DIRECT"

BaseSelect: &BaseSelect
  type: select
  empty-fallback: REJECT

# ==================== 直连节点定义 ====================
proxies:
  - { name: '🇨🇳 直连 | 双栈', type: direct }
  - { name: '🇨🇳 直连 | IPv4优先', type: direct, ip-version: ipv4-prefer }
  - { name: '🇨🇳 直连 | IPv6优先', type: direct, ip-version: ipv6-prefer }

# ==================== 基础配置 ====================
mixed-port: 7890
allow-lan: true
bind-address: "*"
find-process-mode: strict
mode: rule
log-level: warning
ipv6: true
keep-alive-interval: 60
unified-delay: true
tcp-concurrent: true

ntp:
  enable: true
  write-to-system: false
  server: ntp.aliyun.com
  port: 123
  interval: 60

external-controller: '127.0.0.1:9090'
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui

profile:
  store-selected: true
  store-fake-ip: true

# ==================== TUN 模式 ====================
tun:
  enable: false
  stack: system
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true

# ==================== 域名嗅探 ====================
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ==================== Hosts 配置 ====================
# 【说明】
# 对于使用特殊/私有节点域名的机场，如果节点是通过特殊的域名访问而不是 IP，
# 你可能需要在这里手动映射。你可以打开机场提供的订阅配置，查看它的 `hosts` 字段。
# 如果有类似 `proxy-domain.com: [1.2.3.4]` 的内容，请手动将其粘贴到下方。
hosts:
  cloudflare-dns.com: [1.1.1.1, 1.0.0.1]
  dns.google: [8.8.8.8, 8.8.4.4]
  services.googleapis.cn: services.googleapis.com
  "+.mcdn.bilivideo.com": ["0.0.0.0"]
  "+.mcdn.bilivideo.cn": ["0.0.0.0"]
  "+.edge.mountaintoys.cn": ["0.0.0.0"]
  "+.h2.smtcdns.net": ["0.0.0.0"]

# ==================== DNS 配置 ====================
chinaDNS: &chinaDNS [223.5.5.5, 119.29.29.29]
chinaDohDNS: &chinaDohDNS ['https://223.5.5.5/dns-query#DIRECT', 'https://1.12.12.12/dns-query#DIRECT']
foreignDNS: &foreignDNS ['https://cloudflare-dns.com/dns-query#Proxies', 'https://dns.google/dns-query#Proxies']

dns:
  enable: true
  ipv6: true
  use-hosts: true
  cache-algorithm: arc
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-range6: "2001:2::1/48"
  fake-ip-filter:
    - rule-set:Private
    - rule-set:fakeip_filter
    - rule-set:geolocation-cn
  default-nameserver: *chinaDNS
  # 【说明】proxy-server-nameserver 决定了解析节点域名的 DNS。
  # 如果你的机场使用的是普通的域名节点，保持 *chinaDohDNS 即可。
  # 如果你的机场使用了自定义/私有 DNS（比如一些特殊的抗封锁节点），
  # 你需要去机场下发的配置里查看 `proxy-server-nameserver` 字段，
  # 并将那些特殊的 DNS 添加到下方的列表里。
  proxy-server-nameserver: *chinaDohDNS
  nameserver: *foreignDNS
  nameserver-policy:
    "rule-set:cn": *chinaDNS
  direct-nameserver:
    - system
    - 223.5.5.5
    - 119.29.29.29

# ==================== 代理提供者 ====================
proxy-providers:
  01_服务商一:
    <<: [*proxy_providers_common, *global_exclude_filter]
    url: "https://example.com/sub?token=your_token_here"
    override:
      additional-prefix: "[一] "
  02_服务商二:
    <<: [*proxy_providers_common, *global_exclude_filter]
    url: "https://example2.com/sub?token=your_token_here"
    override:
      additional-prefix: "[二] "
  03_服务商三:
    <<: [*proxy_providers_common, *global_exclude_filter]
    url: "https://example3.com/sub?token=your_token_here"
    override:
      additional-prefix: "[三] "

# ==================== 策略组 ====================
