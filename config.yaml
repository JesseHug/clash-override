# ==================== 锚点配置 ====================
BaseProvider: &BaseProvider {
  type: http, interval: 86400, proxy: DIRECT,
  health-check: {enable: true, url: 'http://www.gstatic.com/generate_204', interval: 300},
  filter: '^(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'
}

BaseFB: &BaseFB {type: fallback, interval: 300, lazy: true, url: 'http://www.gstatic.com/generate_204', "max-failures": 2, timeout: 2000, "fallback-interval": 60}

FilterHK: &FilterHK '(?i)港|🇭🇰|HK|Hong|HKG'
FilterSG: &FilterSG '(?i)坡|🇸🇬|SG|Sing|SIN'
FilterTW: &FilterTW '(?i)台|🇹🇼|TW|tai|TPE'
FilterJP: &FilterJP '(?i)日|🇯🇵|JP|Japan|NRT|HND'
FilterUS: &FilterUS '(?i)美|🇺🇸|US|USA|LAX|SFO|JFK'
FilterKR: &FilterKR '(?i)韩|🇰🇷|KR|KOR|Korea|首尔'
FilterEU: &FilterEU '(?i)法|德|英|🇫🇷|🇩🇪|🇬🇧|FR|DE|GB|UK|NL|EU|Europe|Frankfurt|London|Paris|Amsterdam'
FilterOT: &FilterOT '^(?!.*(?i)(港|🇭🇰|HK|Hong|HKG|坡|🇸🇬|SG|Sing|SIN|台|🇹🇼|TW|tai|TPE|日|🇯🇵|JP|Japan|NRT|HND|美|🇺🇸|US|USA|LAX|SFO|JFK|韩|🇰🇷|KR|KOR|Korea|首尔|法|🇫🇷|FR|德|🇩🇪|DE|英|🇬🇧|GB|UK|NL|EU|Europe|Frankfurt|London|Paris|Amsterdam)).*$'

# ==================== 代理提供者 ====================
proxy-providers:
  服务商一:
    <<: *BaseProvider
    url: 'https://example.com/sub?token=your_token_here'
    override: {additional-prefix: '[一] '}
  服务商二:
    <<: *BaseProvider
    url: 'https://example2.com/sub?token=your_token_here'
    override: {additional-prefix: '[二] '}
  服务商三:
    <<: *BaseProvider
    url: 'https://example3.com/sub?token=your_token_here'
    override: {additional-prefix: '[三] '}

# ==================== 核心配置 ====================
mode: rule
mixed-port: 7890
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true
log-level: warning
keep-alive-interval: 1800
find-process-mode: strict
global-client-fingerprint: random

external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui
external-controller: :9090

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    TLS: {ports: [443, 8443]}
    HTTP: {ports: [80, 8080-8880], override-destination: true}

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - rule-set:Private
    - rule-set:Direct
    - rule-set:China

# ==================== 策略组 ====================
proxy-groups:
  # 主要
  - {name: Proxies,   type: select, proxies: [Fallback, HK, JP, SG, TW, US, KR, EU, Other], include-all: true}
  - {name: Final,     type: select, proxies: [Proxies, DIRECT]}
  - {name: Fallback,  type: fallback, proxies: [HK, JP, SG, TW, US, KR, EU, Other], url: 'http://www.gstatic.com/generate_204', interval: 300}

  # 服务分流
  - {name: YouTube,   type: select, proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]}
  - {name: Netflix,   type: select, proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]}
  - {name: Disney,    type: select, proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]}
  - {name: Spotify,   type: select, proxies: [Proxies, DIRECT, HK, JP, SG, TW, US, KR, EU, Other]}
  - {name: Bilibili,  type: select, proxies: [DIRECT, HK, TW, JP, KR, Other]}
  - {name: Telegram,  type: select, proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]}
  - {name: Steam,     type: select, proxies: [Proxies, DIRECT, HK, JP, SG, TW, US, KR, EU, Other]}
  - {name: PayPal,    type: select, proxies: [Proxies, DIRECT, HK, JP, SG, TW, US, KR, EU, Other]}
  - {name: OpenAI,    type: select, proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]}
  - {name: AI,        type: select, proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]}
  - {name: Apple,     type: select, proxies: [Proxies, DIRECT, HK, JP, SG, TW, US, KR, EU, Other]}
  - {name: Speedtest, type: select, proxies: [DIRECT, Proxies, HK, JP, SG, TW, US, KR, EU, Other]}

  # 地区 fallback
  - {name: HK,    <<: *BaseFB, include-all: true, filter: *FilterHK}
  - {name: SG,    <<: *BaseFB, include-all: true, filter: *FilterSG}
  - {name: TW,    <<: *BaseFB, include-all: true, filter: *FilterTW}
  - {name: JP,    <<: *BaseFB, include-all: true, filter: *FilterJP}
  - {name: US,    <<: *BaseFB, include-all: true, filter: *FilterUS}
  - {name: KR,    <<: *BaseFB, include-all: true, filter: *FilterKR}
  - {name: EU,    <<: *BaseFB, include-all: true, filter: *FilterEU}
  - {name: Other, type: select, include-all: true, filter: *FilterOT}

# ==================== 规则路由 ====================
rules:
  - RULE-SET,LocalAreaNetwork,DIRECT
  - RULE-SET,Unbreak,DIRECT
  - RULE-SET,Speedtest,Speedtest
  - RULE-SET,YouTube,YouTube
  - RULE-SET,Netflix,Netflix
  - RULE-SET,Disney,Disney
  - RULE-SET,Spotify,Spotify
  - RULE-SET,Bilibili,Bilibili
  - RULE-SET,Telegram,Telegram
  - RULE-SET,Steam,Steam
  - RULE-SET,PayPal,PayPal
  - RULE-SET,OpenAI,OpenAI
  - RULE-SET,AI,AI
  - RULE-SET,AppleCN,DIRECT
  - RULE-SET,Apple,Apple
  - RULE-SET,Proxies,Proxies
  - RULE-SET,ChinaDomain,DIRECT
  - RULE-SET,ChinaIP,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,Final

