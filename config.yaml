# ==================== 基础配置 ====================
mixed-port: 7890
allow-lan: true
bind-address: "*"
find-process-mode: strict
mode: rule
log-level: warning
ipv6: true
keep-alive-interval: 1800

unified-delay: true
tcp-concurrent: true

geox-url:
  geoip: "https://ghfast.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  mmdb: "https://ghfast.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb"

global-client-fingerprint: random

external-controller: :9090
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui

profile:
  store-selected: true
  store-fake-ip: true

# ==================== 域名嗅探 ====================
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true

# ==================== DNS 配置 ====================
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - rule-set:Private
    - rule-set:Direct
    - rule-set:China
    - +.push.apple.com
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

# ==================== 代理提供者（多订阅源） ====================
proxy-providers:
  服务商一:
    type: http
    url: "https://example.com/sub?token=your_token_here"
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: "http://www.gstatic.com/generate_204"
      interval: 300
    override:
      additional-prefix: "[一] "
  服务商二:
    type: http
    url: "https://example2.com/sub?token=your_token_here"
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: "http://www.gstatic.com/generate_204"
      interval: 300
    override:
      additional-prefix: "[二] "
  服务商三:
    type: http
    url: "https://example3.com/sub?token=your_token_here"
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: "http://www.gstatic.com/generate_204"
      interval: 300
    override:
      additional-prefix: "[三] "

# ==================== 策略组 ====================
proxy-groups:
  # 主要
  - name: Proxies
    type: select
    proxies:
      - Fallback
      - HK
      - JP
      - SG
      - TW
      - US
      - KR
      - EU
      - Other
    include-all: true

  - name: Final
    type: select
    proxies:
      - Proxies
      - DIRECT

  - name: Fallback
    type: fallback
    proxies:
      - HK
      - JP
      - SG
      - TW
      - US
      - KR
      - EU
      - Other
    url: "http://www.gstatic.com/generate_204"
    interval: 300

  # 服务分流
  - name: YouTube
    type: select
    proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]
  - name: Netflix
    type: select
    proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]
  - name: Disney
    type: select
    proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]
  - name: Spotify
    type: select
    proxies: [Proxies, DIRECT, HK, JP, SG, TW, US, KR, EU, Other]
  - name: Bilibili
    type: select
    proxies: [DIRECT, HK, TW, JP, KR, Other]
  - name: Telegram
    type: select
    proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]
  - name: Steam
    type: select
    proxies: [Proxies, DIRECT, HK, JP, SG, TW, US, KR, EU, Other]
  - name: PayPal
    type: select
    proxies: [Proxies, DIRECT, HK, JP, SG, TW, US, KR, EU, Other]
  - name: OpenAI
    type: select
    proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]
  - name: AI
    type: select
    proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]
  - name: Apple
    type: select
    proxies: [Proxies, DIRECT, HK, JP, SG, TW, US, KR, EU, Other]
  - name: Speedtest
    type: select
    proxies: [DIRECT, Proxies, HK, JP, SG, TW, US, KR, EU, Other]

  # 地区自动 fallback
  - &BaseFB
    name: HK
    type: fallback
    interval: 300
    lazy: true
    url: "http://www.gstatic.com/generate_204"
    timeout: 2000
    max-failures: 2
    fallback-interval: 60
    include-all: true
    filter: "(?i)港|🇭🇰|HK|Hong|HKG"

  - <<: *BaseFB
    name: SG
    filter: "(?i)坡|🇸🇬|SG|Sing|SIN"

  - <<: *BaseFB
    name: TW
    filter: "(?i)台|🇹🇼|TW|tai|TPE"

  - <<: *BaseFB
    name: JP
    filter: "(?i)日|🇯🇵|JP|Japan|NRT|HND"

  - <<: *BaseFB
    name: US
    filter: "(?i)美|🇺🇸|US|USA|LAX|SFO|JFK"

  - <<: *BaseFB
    name: KR
    filter: "(?i)韩|🇰🇷|KR|KOR|Korea|首尔"

  - <<: *BaseFB
    name: EU
    filter: "(?i)法|德|英|🇫🇷|🇩🇪|🇬🇧|FR|DE|GB|UK|NL|EU|Europe|Frankfurt|London|Paris|Amsterdam"

  - name: Other
    type: select
    include-all: true
    filter: '^(?!.*(?i)(港|🇭🇰|HK|Hong|HKG|坡|🇸🇬|SG|Sing|SIN|台|🇹🇼|TW|tai|TPE|日|🇯🇵|JP|Japan|NRT|HND|美|🇺🇸|US|USA|LAX|SFO|JFK|韩|🇰🇷|KR|KOR|Korea|首尔|法|🇫🇷|FR|德|🇩🇪|DE|英|🇬🇧|GB|UK|NL|EU|Europe|Frankfurt|London|Paris|Amsterdam)).*$'

# ==================== 规则集 ====================
