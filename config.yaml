# =========================================================
#  FLClash / Mihomo 高性能配置
#  仓库：https://github.com/JesseHug/clash-override
#  链接：https://raw.githubusercontent.com/JesseHug/clash-override/master/config.yaml
#  完全对齐 override.js v9.0
# =========================================================

# ==================== 基础配置 ====================
mixed-port: 7890
allow-lan: true
bind-address: "*"
find-process-mode: strict
mode: rule
log-level: warning
ipv6: true
keep-alive-interval: 1800
unified-delay: true
tcp-concurrent: true

geox-url:
  geoip: "https://ghfast.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  mmdb: "https://ghfast.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb"

geodata-mode: true

ntp:
  enable: true
  server: ntp.aliyun.com
  port: 123
  interval: 30

external-controller: :9090
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui

profile:
  store-selected: true
  store-fake-ip: true

# ==================== TUN 模式 ====================
tun:
  enable: false
  stack: system
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-detect-interface: true
  strict-route: true

# ==================== 域名嗅探 ====================
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ==================== Hosts 配置 ====================
hosts:
  dns.alidns.com: [223.5.5.5, 223.6.6.6]
  doh.pub: [1.12.12.12, 120.53.53.53]
  dns.cloudflare.com: [1.1.1.1, 1.0.0.1]
  dns.google: [8.8.8.8, 8.8.4.4]
  services.googleapis.cn: services.googleapis.com
  "+.mcdn.bilivideo.com": ["0.0.0.0"]
  "+.mcdn.bilivideo.cn": ["0.0.0.0"]

# ==================== DNS 配置 ====================
dns:
  enable: true
  ipv6: true
  use-hosts: true
  cache-algorithm: arc
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - rule-set:Private
    - rule-set:fakeip_filter
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  nameserver:
    - https://dns.cloudflare.com/dns-query#Proxies
    - https://dns.google/dns-query#Proxies
  nameserver-policy:
    "rule-set:ChinaDomain,cn_additional":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
  direct-nameserver:
    - system
    - 223.5.5.5
    - 119.29.29.29

# ==================== 代理提供者 ====================
proxy-providers:
  服务商一:
    type: http
    url: "https://example.com/sub?token=your_token_here"
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: "https://g.cn/generate_204"
      interval: 600
    override:
      additional-prefix: "[一] "
  服务商二:
    type: http
    url: "https://example2.com/sub?token=your_token_here"
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: "https://g.cn/generate_204"
      interval: 600
    override:
      additional-prefix: "[二] "
  服务商三:
    type: http
    url: "https://example3.com/sub?token=your_token_here"
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: "https://g.cn/generate_204"
      interval: 600
    override:
      additional-prefix: "[三] "

# ==================== 策略组模板 ====================
BaseUT: &BaseUT {type: url-test, url: "https://g.cn/generate_204", interval: 600, tolerance: 50, lazy: true, timeout: 3000, hidden: true}

# ==================== 策略组 ====================
proxy-groups:
  - name: Proxies
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
    proxies:
      - Auto
      - HK
      - JP
      - SG
      - TW
      - US
      - KR
      - EU
      - Other
    include-all: true
  - name: Google
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png
    proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]
  - name: YouTube
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
    proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]
  - name: Spotify
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png
    proxies: [Proxies, DIRECT, HK, JP, SG, TW, US, KR, EU, Other]
  - name: Telegram
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram_X.png
    proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]
  - name: Games
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Game.png
    proxies: [Proxies, DIRECT, HK, JP, SG, TW, US, KR, EU, Other]
  - name: PayPal
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/PayPal.png
    proxies: [Proxies, DIRECT, HK, JP, SG, TW, US, KR, EU, Other]
  - name: X
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/X.png
    proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]
  - name: OpenAI
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
    proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]
  - name: AI
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/AI.png
    proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]
  - name: Apple
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png
    proxies: [Proxies, DIRECT, HK, JP, SG, TW, US, KR, EU, Other]
  - name: Final
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png
    proxies: [Proxies, DIRECT]

  - name: Auto
    type: url-test
    url: "https://g.cn/generate_204"
    interval: 600
    tolerance: 50
    lazy: true
    timeout: 3000
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
    proxies: [HK, JP, SG, TW, US, KR, EU, Other]

  # 地区策略组（手动 select + 隐藏 url-test 自动选择）
  - name: HK
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    proxies: [HK-自动选择]
    include-all: true
    filter: "(?i)港|HK|HongKong|Hong Kong"
  - name: SG
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png
    proxies: [SG-自动选择]
    include-all: true
    filter: "(?i)坡|SG|Singapore"
  - name: TW
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Taiwan.png
    proxies: [TW-自动选择]
    include-all: true
    filter: "(?i)台|TW|Taiwan"
  - name: JP
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
    proxies: [JP-自动选择]
    include-all: true
    filter: "(?i)日|JP|Japan"
  - name: US
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
    proxies: [US-自动选择]
    include-all: true
    filter: "(?i)美|US|UnitedStates|United States"
  - name: KR
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Korea.png
    proxies: [KR-自动选择]
    include-all: true
    filter: "(?i)韩|KR|KOR|Korea"
  - name: EU
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/European_Union.png
    proxies: [EU-自动选择]
    include-all: true
    filter: "(?i)法|德|英|荷|FR|DE|GB|UK|NL|EU|Europe|Frankfurt|London|Paris|Amsterdam"
  - name: Other
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Europe_Map.png
    proxies: [Other-自动选择]
    include-all: true
    filter: '^(?!.*(?i)(港|HK|HongKong|坡|SG|Singapore|台|TW|Taiwan|日|JP|Japan|美|US|UnitedStates|韩|KR|KOR|Korea|法|FR|德|DE|英|GB|UK|NL|EU|Europe)).*$'

  # 隐藏的 url-test 自动选择组（include-all + filter 动态注入节点）
  - <<: *BaseUT
    name: HK-自动选择
    include-all: true
    filter: "(?i)港|HK|HongKong|Hong Kong"
  - <<: *BaseUT
    name: SG-自动选择
    include-all: true
    filter: "(?i)坡|SG|Singapore"
  - <<: *BaseUT
    name: TW-自动选择
    include-all: true
    filter: "(?i)台|TW|Taiwan"
  - <<: *BaseUT
    name: JP-自动选择
    include-all: true
    filter: "(?i)日|JP|Japan"
  - <<: *BaseUT
    name: US-自动选择
    include-all: true
    filter: "(?i)美|US|UnitedStates|United States"
  - <<: *BaseUT
    name: KR-自动选择
    include-all: true
    filter: "(?i)韩|KR|KOR|Korea"
  - <<: *BaseUT
    name: EU-自动选择
    include-all: true
    filter: "(?i)法|德|英|荷|FR|DE|GB|UK|NL|EU|Europe|Frankfurt|London|Paris|Amsterdam"
  - <<: *BaseUT
    name: Other-自动选择
    include-all: true
    filter: '^(?!.*(?i)(港|HK|HongKong|坡|SG|Singapore|台|TW|Taiwan|日|JP|Japan|美|US|UnitedStates|韩|KR|KOR|Korea|法|FR|德|DE|英|GB|UK|NL|EU|Europe)).*$'

# ==================== 规则集 ====================
BehaviorDN: &BehaviorDN {type: http, behavior: domain, format: mrs, interval: 86400}
BehaviorIP: &BehaviorIP {type: http, behavior: ipcidr, format: mrs, interval: 86400}

rule-providers:
  GoogleFCM:    {<<: *BehaviorDN, url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/googlefcm.mrs}
  Direct:       {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Direct.mrs}
  Private:      {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Private.mrs}
  YouTube:      {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/YouTube.mrs}
  Spotify:      {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Spotify.mrs}
  Telegram:     {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Telegram.mrs}
  Steam:        {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Games.mrs}
  PayPal:       {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/PayPal.mrs}
  Twitter:      {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Twitter.mrs}
  OpenAI:       {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/OpenAI.mrs}
  AI:           {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/AI.mrs}
  AppleCN:      {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/AppleCN.mrs}
  Apple:        {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Apple.mrs}
  Google:       {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Google.mrs}
  Proxies:      {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Proxy.mrs}
  ChinaDomain:  {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/China.mrs}
  ChinaIP:      {<<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/China.mrs}
  AIIP:         {<<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/AI.mrs}
  GoogleIP:     {<<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Google.mrs}
  ProxyIP:      {<<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Proxy.mrs}
  TelegramIP:   {<<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Telegram.mrs}
  PrivateIP:    {<<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Private.mrs}
  fakeip_filter:{<<: *BehaviorDN, url: https://fastly.jsdelivr.net/gh/wwqgtxx/clash-rules@release/fakeip-filter.mrs}
  cn_additional:{<<: *BehaviorDN, url: https://static-file-global.353355.xyz/rules/cn-additional-list.mrs}

# ==================== 路由规则 ====================
rules:
  # QUIC 拦截：禁用国外 UDP/443，防止视频卡顿
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((OR,((RULE-SET,ChinaDomain),(RULE-SET,cn_additional),(RULE-SET,ChinaIP,no-resolve)))))),REJECT

  # 直连 & 私有网络
  - RULE-SET,Direct,DIRECT
  - RULE-SET,Private,DIRECT

  # Apple 国内直连
  - RULE-SET,AppleCN,DIRECT

  # FCM 推送 → Proxies
  - RULE-SET,GoogleFCM,Proxies

  # AI
  - RULE-SET,OpenAI,OpenAI
  - RULE-SET,AI,AI

  # 流媒体 & 应用
  - RULE-SET,YouTube,YouTube
  - RULE-SET,Google,Google
  - RULE-SET,Spotify,Spotify
  - RULE-SET,Telegram,Telegram
  - RULE-SET,Steam,Games
  - RULE-SET,PayPal,PayPal
  - RULE-SET,Twitter,X
  - RULE-SET,Apple,Apple

  # 国外网站兜底
  - RULE-SET,Proxies,Proxies

  # 国内域名
  - RULE-SET,ChinaDomain,DIRECT
  - RULE-SET,cn_additional,DIRECT

  # IP 规则（no-resolve：不主动触发 DNS，仅已知 IP 时匹配）
  - RULE-SET,PrivateIP,DIRECT,no-resolve
  - RULE-SET,AIIP,AI,no-resolve
  - RULE-SET,GoogleIP,Google,no-resolve
  - RULE-SET,TelegramIP,Telegram,no-resolve
  - RULE-SET,ProxyIP,Proxies,no-resolve
  - RULE-SET,ChinaIP,DIRECT,no-resolve

  # GeoIP 兜底
  - GEOIP,CN,DIRECT
  - MATCH,Final
