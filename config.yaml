# =========================================================
#  FLClash / Mihomo 高性能配置
#  基于官方模板 + 自用优化
# =========================================================

# ==================== 基础配置 ====================

# 【开关】代理监听端口，HTTP/SOCKS 共用
mixed-port: 7890

# 【开关】允许局域网设备连接此代理（手机/平板/电视共享）
# true=允许  false=仅本机可用
allow-lan: true
bind-address: "*"

# 【开关】进程匹配模式
# strict=智能匹配  always=强制匹配全部进程  off=关（路由器省电）
find-process-mode: strict

# 【开关】运行模式 rule=规则模式  global=全局代理  direct=全局直连
mode: rule

# 【开关】日志等级 silent=关  error=仅错误  warning=警告  info=info  debug=调试（最详细）
log-level: warning

# 【开关】IPv6 true=开启  false=关闭（部分机场要求关掉IPv6）
ipv6: true

# 【开关】TCP 保活间隔（秒），防止代理连接被 NAT 掐断导致断流
# 1800=30分钟一次（省电）  15=15秒一次（响应快但耗电）
keep-alive-interval: 1800

# 【性能优化】统一延迟计算 & TCP 并发，明显提升测速准确度
unified-delay: true
tcp-concurrent: true

# GeoIP 数据库国内加速镜像（仅 GEOIP,CN 需要）
geox-url:
  geoip: "https://ghfast.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  mmdb: "https://ghfast.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb"


# 【开关】Geo 数据库模式（GEOIP/GEOSITE 需要此模式）
geodata-mode: true

# 【开关】NTP 时间同步，防止系统时间不准导致 HTTPS 证书报错
ntp:
  enable: true
  server: ntp.aliyun.com
  port: 123
  interval: 30

# ==================== Smart 内核专属设置 ====================
# 【开关】Smart 智能策略组需要魔改版 Mihomo 内核
# 普通内核请保持注释状态，切勿启用会导致无法启动！
# 魔改内核：https://github.com/vernesong/mihomo/releases
# 开启后把地区策略组的 type: fallback 改成 type: smart 即可
# smart-config:
#   lgbm-auto-update: false      # 自动更新预测模型
#   lgbm-update-interval: 72     # 模型更新间隔（小时）
#   lgbm-url: "https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model.bin"

# 管理面板（通过 http://127.0.0.1:9090/ui 访问）
# 如果暴露在公网，建议加 secret: 你的密码 防止别人控制
external-controller: :9090
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui

# 【开关】记住手动选择的节点 / 缓存 DNS 结果
profile:
  store-selected: true
  store-fake-ip: true

# ==================== TUN 模式 ====================
# 【开关】虚拟网卡模式，所有流量强制经过代理（不需要配浏览器/App代理）
# 耗电且可能与其他VPN冲突，非必要保持关闭
tun:
  enable: false    # true=开启（需要管理员权限） false=关闭
  stack: system    # system / gvisor / mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-detect-interface: true
  strict-route: true

# ==================== 域名嗅探 ====================
# 把 IP 请求还原成域名，让规则能正确匹配
# 如果机场要求关掉，就把 enable 改为 false
sniffer:
  enable: true   # true=开启  false=关闭
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
  # 跳过以下域名不嗅探（避免推送/智能家居干扰）
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ==================== Hosts 配置 ====================
# 预置 DNS 服务器 IP，防止 DNS 服务器域名本身无法解析
hosts:
  dns.alidns.com: [223.5.5.5, 223.6.6.6]
  doh.pub: [1.12.12.12, 120.53.53.53]
  dns.cloudflare.com: [1.1.1.1, 1.0.0.1]
  dns.google: [8.8.8.8, 8.8.4.4]
  services.googleapis.cn: services.googleapis.com

  # 屏蔽哔哩哔哩 PCDN，解决看视频卡顿问题
  "+.mcdn.bilivideo.com": ["0.0.0.0"]
  "+.mcdn.bilivideo.cn": ["0.0.0.0"]

# ==================== DNS 配置（教科书方案） ====================
dns:
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: "198.18.0.1/16"
  fake-ip-range6: ""
  fake-ip-filter-mode: rule
  fake-ip-ttl: 1
  fake-ip-filter:
    - rule-set:fakeip_filter
    - rule-set:Private
    - rule-set:Direct
    - rule-set:China

  default-nameserver:
    - 223.5.5.5

  proxy-server-nameserver:
    - 223.5.5.5

  direct-nameserver:
    - 223.5.5.5
  direct-nameserver-follow-policy: false

  nameserver:
    - "https://8.8.8.8/dns-query#proxy&disable-ipv6=true&ecs=114.114.114.114/24&ecs-override=true"

  fallback:
    - "https://1.1.1.1/dns-query#proxy"
  fallback-filter:
    geoip: true
    geoip-code: CN

# ==================== 代理提供者（多订阅源） ====================
# 把你的机场订阅链接替换下方 url: 后面的地址
# 可以添加多个，自动聚合节点
proxy-providers:
  服务商一:
    type: http
    url: "https://example.com/sub?token=your_token_here"
    interval: 86400           # 每24小时刷新一次订阅
    proxy: DIRECT             # 用直连下载订阅（如果机场需要代理才能访问，改成你的节点名）
    health-check:
      enable: true
      url: "http://www.gstatic.com/generate_204"
      interval: 600
    override:
      additional-prefix: "[一] "  # 节点名前缀，区分来自哪个机场

  服务商二:
    type: http
    url: "https://example2.com/sub?token=your_token_here"
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: "http://www.gstatic.com/generate_204"
      interval: 600
    override:
      additional-prefix: "[二] "

  服务商三:
    type: http
    url: "https://example3.com/sub?token=your_token_here"
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: "http://www.gstatic.com/generate_204"
      interval: 600
    override:
      additional-prefix: "[三] "

# ==================== 策略组 ====================
# 在面板里看到的节点分组，从上到下排列
proxy-groups:

  # 【主入口】面板上选这个来切换默认走哪个地区
  - name: Proxies
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Global.png
    type: select
    proxies:
      - Fallback       # 自动选地区
      - HK
      - JP
      - SG
      - TW
      - US
      - KR
      - EU
      - Other          # 冷门地区兜底
    include-all: true  # 也显示所有单个节点

  # 【最终兜底】所有规则都没匹配到就走这里
  - name: Final
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Final.png
    type: select
    proxies:
      - Proxies
      - DIRECT

  # 【自动地区切换】从上到下试，哪个地区有活节点就用哪个
  - name: Fallback
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Auto.png
    type: fallback
    proxies:
      - HK
      - JP
      - SG
      - TW
      - US
      - KR
      - EU
      - Other
    url: "http://www.gstatic.com/generate_204"
    interval: 600

  # ====== 服务分流 ======
  - name: YouTube
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/YouTube.png
    type: select
    proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]
  - name: Netflix
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Netflix.png
    type: select
    proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]
  - name: Spotify
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Spotify.png
    type: select
    proxies: [Proxies, DIRECT, HK, JP, SG, TW, US, KR, EU, Other]
  - name: Telegram
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Telegram_X.png
    type: select
    proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]
  - name: Steam
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Game.png
    type: select
    proxies: [Proxies, DIRECT, HK, JP, SG, TW, US, KR, EU, Other]
  - name: PayPal
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/PayPal.png
    type: select
    proxies: [Proxies, DIRECT, HK, JP, SG, TW, US, KR, EU, Other]
  - name: X
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/X.png
    type: select
    proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]
  - name: OpenAI
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/ChatGPT.png
    type: select
    proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]
  - name: AI
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/AI.png
    type: select
    proxies: [Proxies, HK, JP, SG, TW, US, KR, EU, Other]
  - name: Apple
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Apple.png
    type: select
    proxies: [Proxies, DIRECT, HK, JP, SG, TW, US, KR, EU, Other]
  - name: Speedtest
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Speedtest.png
    type: select
    proxies: [DIRECT, Proxies, HK, JP, SG, TW, US, KR, EU, Other]

  # ====== 地区自动 fallback ======
  # 每个地区自动测速换节点，指标：
  #   lazy=true — 闲置不测省电
  #   timeout=2000 — 2秒没响应算超时
  #   max-failures=2 — 连续挂2次才换，防误判
  #   fallback-interval=60 — 备用节点每60秒轻触一次
  - &BaseFB
    name: HK
    type: fallback
    interval: 600
    lazy: true
    url: "http://www.gstatic.com/generate_204"
    timeout: 3000
    max-failures: 3
    fallback-interval: 60
    include-all: true
    filter: "(?i)港|🇭🇰|HK|Hong|HKG"

  - <<: *BaseFB
    name: SG
    filter: "(?i)坡|🇸🇬|SG|Sing|SIN"

  - <<: *BaseFB
    name: TW
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Taiwan.png
    filter: "(?i)台|🇹🇼|TW|tai|TPE"

  - <<: *BaseFB
    name: JP
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Japan.png
    filter: "(?i)日|🇯🇵|JP|Japan|NRT|HND"

  - <<: *BaseFB
    name: US
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/United_States.png
    filter: "(?i)美|🇺🇸|US|USA|LAX|SFO|JFK"

  - <<: *BaseFB
    name: KR
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Korea.png
    filter: "(?i)韩|🇰🇷|KR|KOR|Korea|首尔"

  - <<: *BaseFB
    name: EU
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/European_Union.png
    filter: "(?i)法|德|英|🇫🇷|🇩🇪|🇬🇧|FR|DE|GB|UK|NL|EU|Europe|Frankfurt|London|Paris|Amsterdam"

  # 【冷门地区】没被上面7个地区匹配到的节点全在这
  # 土耳其/印度/巴西/俄罗斯等
  - name: Other
    icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Europe_Map.png
    type: select
    include-all: true
    filter: '^(?!.*(?i)(港|🇭🇰|HK|Hong|HKG|坡|🇸🇬|SG|Sing|SIN|台|🇹🇼|TW|tai|TPE|日|🇯🇵|JP|Japan|NRT|HND|美|🇺🇸|US|USA|LAX|SFO|JFK|韩|🇰🇷|KR|KOR|Korea|首尔|法|🇫🇷|FR|德|🇩🇪|DE|英|🇬🇧|GB|UK|NL|EU|Europe|Frankfurt|London|Paris|Amsterdam)).*$'

# ==================== 规则集（远端子规则） ====================
# 自动从 GitHub 下载编译好的 .mrs 二进制规则集
# 全部使用 666OS .mrs（二进制编译，O(1) 匹配）
BehaviorDN: &BehaviorDN {type: http, behavior: domain, format: mrs, interval: 86400}
BehaviorIP: &BehaviorIP {type: http, behavior: ipcidr, format: mrs, interval: 86400}

rule-providers:
  Direct:           {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Direct.mrs}
  Private:          {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Private.mrs}
  Speedtest:        {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Speedtest.mrs}
  YouTube:          {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/YouTube.mrs}
  Netflix:          {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Netflix.mrs}
  Spotify:          {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Spotify.mrs}
  Telegram:         {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Telegram.mrs}
  Steam:            {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Games.mrs}
  PayPal:           {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/PayPal.mrs}
  Twitter:          {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Twitter.mrs}
  OpenAI:           {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/OpenAI.mrs}
  AI:               {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/AI.mrs}
  AppleCN:          {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/AppleCN.mrs}
  Apple:            {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Apple.mrs}
  Google:           {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Google.mrs}
  Proxies:          {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Proxy.mrs}
  ChinaDomain:      {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/China.mrs}
  ChinaIP:          {<<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/China.mrs}
  AIIP:             {<<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/AI.mrs}
  NetflixIP:        {<<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Netflix.mrs}
  GoogleIP:         {<<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Google.mrs}
  ProxyIP:          {<<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Proxy.mrs}
  fakeip_filter:    {<<: *BehaviorDN, url: https://fastly.jsdelivr.net/gh/wwqgtxx/clash-rules@release/fakeip-filter.mrs}
  cn_additional:    {<<: *BehaviorDN, url: https://static-file-global.353355.xyz/rules/cn-additional-list.mrs}
  Private:          {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Private.mrs}
  Direct:           {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Direct.mrs}
  China:            {<<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/China.mrs}

# ==================== 路由规则 ====================
# 规则从上到下依次匹配，命中即止
rules:
  # 局域网 / 内网地址 → 直连
  # 直连 & 私有网络
  - RULE-SET,Direct,DIRECT
  - RULE-SET,Private,DIRECT

  # 测速网站 → Speedtest 组
  - RULE-SET,Speedtest,Speedtest

  # 流媒体 & 应用分流
  - RULE-SET,YouTube,YouTube
  - RULE-SET,Netflix,Netflix
  - RULE-SET,Spotify,Spotify
  - RULE-SET,Telegram,Telegram
  - RULE-SET,Steam,Steam

  # 支付
  - RULE-SET,PayPal,PayPal

  # 社交
  - RULE-SET,Twitter,X

  # AI
  - RULE-SET,OpenAI,OpenAI
  - RULE-SET,AI,AI

  # Apple（国内苹果直连，国外苹果走代理）
  - RULE-SET,AppleCN,DIRECT
  - RULE-SET,Apple,Apple
  # Google 分流至 Proxies（使香港等地区节点能正常下载 Play Store）
  - RULE-SET,Google,Proxies

  # 国外网站兜底
  - RULE-SET,Proxies,Proxies

  # 国内直连
  - RULE-SET,ChinaDomain,DIRECT
  - RULE-SET,cn_additional,DIRECT

  # IP 规则（no-resolve：不主动触发 DNS，仅已知 IP 时匹配）
  - RULE-SET,NetflixIP,Netflix,no-resolve
  - RULE-SET,AIIP,AI,no-resolve
  - RULE-SET,GoogleIP,Proxies,no-resolve
  - RULE-SET,ProxyIP,Proxies,no-resolve
  - RULE-SET,ChinaIP,DIRECT,no-resolve
  - GEOIP,CN,DIRECT

  # 最终兜底
  - MATCH,Final
